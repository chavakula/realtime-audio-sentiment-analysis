version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"   # FastAPI WebSocket server
      - "8501:8501"   # Streamlit dashboard
    environment:
      - WHISPER_MODEL=base.en
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
    volumes:
      - model-cache:/root/.cache   # Persist downloaded models
    deploy:
      resources:
        limits:
          memory: 4G

volumes:
  model-cache:
